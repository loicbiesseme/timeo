[package]
name = "timeo"
version = "0.1.0"
description = "Suivi du temps de travail"
authors = ["Timeo"]
edition = "2021"
rust-version = "1.77.2"

# Le binaire délègue tout à la lib (indispensable pour la cible mobile / les tests).
[lib]
name = "timeo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
